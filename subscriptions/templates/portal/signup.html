{% extends 'portal/base.html' %}
{% block title %}تسجيل محل جديد — ZONE X{% endblock %}
{% block content %}
<div style="max-width:560px;margin:0 auto">
  <h2 class="section-title" style="font-size:26px">تسجيل محلّك</h2>
  <p class="section-sub">الباقة المختارة: <b style="color:var(--cyan)">{{ plan_info.label }} — ${{ plan_info.price }}</b></p>

  <form method="post" class="card">
    {% csrf_token %}
    <input type="hidden" name="plan" id="planField" value="{{ plan }}">

    <label>الباقة</label>
    <select onchange="document.getElementById('planField').value=this.value">
      {% for key,label in plans %}
      <option value="{{ key }}" {% if key == plan %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>

    <label>اسم المحل *</label>
    <input class="input" name="store_name" required placeholder="مثال: ZONE X Gaming" value="{{ request.POST.store_name }}">
    <div style="color:var(--amber);font-size:12px;margin-top:5px">⚠️ اكتب الاسم بدقّة — كود التفعيل بينربط فيه، ولازم تكتبه نفسه بالبرنامج.</div>

    <label>اسم صاحب المحل *</label>
    <input class="input" name="owner_name" required value="{{ request.POST.owner_name }}">

    <label>رقم الهاتف / واتساب *</label>
    <input class="input" name="phone" required placeholder="+963..." value="{{ request.POST.phone }}">

    <label>البريد الإلكتروني (اختياري)</label>
    <input class="input" name="email" type="email" value="{{ request.POST.email }}">

    <label>الدولة</label>
    <select name="country">
      {% for code,label in countries %}<option value="{{ code }}">{{ label }}</option>{% endfor %}
    </select>

    <button class="btn btn-primary" style="width:100%;margin-top:22px;height:50px"><i class="ti ti-arrow-left"></i> متابعة للدفع</button>
  </form>
</div>
{% endblock %}
