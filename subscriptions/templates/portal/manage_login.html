{% extends 'portal/base.html' %}
{% block title %}دخول الإدارة — ZONE X{% endblock %}
{% block content %}
<div style="max-width:400px;margin:50px auto">
  <h2 class="section-title" style="font-size:24px">🔐 لوحة الإدارة</h2>
  <form method="post" class="card">
    {% csrf_token %}
    {% if error %}<div class="msg error">{{ error }}</div>{% endif %}
    <label>اسم المستخدم</label>
    <input class="input" name="username" required autofocus>
    <label>كلمة المرور</label>
    <input class="input" name="password" type="password" required>
    <button class="btn btn-primary" style="width:100%;margin-top:20px;height:48px"><i class="ti ti-login"></i> دخول</button>
  </form>
</div>
{% endblock %}
